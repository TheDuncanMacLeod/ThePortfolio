name: Tests et déploiement

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Tests et build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Tests unitaires
        run: npm test

      - name: Vérification des types et build
        run: npm run build

      - name: Installation du navigateur de test
        run: npx playwright install --with-deps chromium

      - name: Tests de bout en bout
        run: npm run test:e2e

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publication sur GitHub Pages
    needs: verify
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
